<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#101012">
  <title>Visi0n Spatial — MR Lab</title>
  <link rel="stylesheet" href="styles.css">
  
  <!-- Dépendances -->
  <script defer src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/fulltilt-ng@1.0.3/dist/fulltilt.min.js"></script>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <script defer src="main.js"></script>
</head>
<body>
  <!-- Flux caméra de fond -->
  <video id="input-video" class="room-camera" playsinline autoplay muted disablepictureinpicture></video>
  <canvas id="scan-canvas" aria-hidden="true"></canvas>
  <canvas id="game-canvas" aria-hidden="true"></canvas>
  
  <!-- Couche Main / Aura -->
  <canvas id="hand-canvas" width="1280" height="720" aria-hidden="true"></canvas>
  <div id="hand-cursor" class="hand-cursor" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <!-- Header Info -->
  <header class="top-header">
    <div class="brand">Visi0n · MR</div>
    <div class="status-pill" id="status-pill">
      <span class="dot" id="status-dot"></span>
      <span id="status-text">Prêt</span>
    </div>
    <button class="icon-btn" id="orientation-pill" title="Réancrer">Portrait</button>
  </header>

  <!-- Écran Vidéo Spatial -->
  <section class="spatial-screen" id="ar-screen" hidden>
    <header class="window-bar" id="screen-bar">
      <div class="window-dots"><span></span><span></span><span></span></div>
      <span class="window-title" id="screen-name">Lecteur Vidéo</span>
      <button id="close-screen" class="window-close">✕</button>
    </header>
    <div class="window-content">
      <video id="uploaded-video" controls playsinline></video>
      <div class="empty-state" id="empty-video">Sélectionnez une vidéo</div>
      <button class="play-orb" id="screen-play" hidden>▶</button>
    </div>
    <div class="resize-handle" id="resize-handle">⋰</div>
  </section>

  <!-- HUD Jeu -->
  <div class="game-hud" id="game-hud" hidden>
    <div class="stat"><span>SCORE</span><b id="game-score">0</b></div>
    <div class="stat"><span>RATÉ</span><b id="game-missed">0</b></div>
  </div>

  <!-- Taskbar Spatiale (Style Meta Quest) -->
  <nav class="spatial-dock" id="vr-taskbar" hidden>
    <button class="dock-btn" data-vr-action="reanchor" title="Réancrer">⌖</button>
    <button class="dock-btn" data-vr-action="game" title="Jeu">🎮</button>
    <button class="dock-btn" data-vr-action="play" title="Play/Pause">▶</button>
    <button class="dock-btn" data-vr-action="keyboard" title="Clavier">⌨️</button>
    <button class="dock-btn" data-vr-action="photos" title="Galerie">📸</button>
    <button class="dock-btn" data-vr-action="ar" title="Placer en AR">🧊</button>
    <button class="dock-btn" data-vr-action="spotify" title="Spotify">🎵</button>
    <button class="dock-btn" data-vr-action="yaw-" title="Pivoter G">↺</button>
    <button class="dock-btn" data-vr-action="yaw+" title="Pivoter D">↻</button>
    <button class="dock-btn" data-vr-action="close-screen" title="Fermer">✕</button>
    <button class="dock-btn accent" data-vr-action="exit" title="Quitter">⏻</button>
  </nav>

  <!-- Clavier Virtuel -->
  <div class="spatial-panel keyboard-panel" id="keyboard-panel" hidden>
    <div class="kb-display" id="kb-display" contenteditable="true" spellcheck="false"></div>
    <div class="kb-keys" id="kb-keys"></div>
    <button class="panel-close" id="kb-close">✕</button>
  </div>

  <!-- App Photos -->
  <div class="spatial-panel photos-panel" id="photos-app" hidden>
    <div class="panel-header">
      <button class="tab active" id="tab-photo">📷 Photo</button>
      <button class="tab" id="tab-video">🎥 Vidéo</button>
      <button class="panel-close" id="photos-close">✕</button>
    </div>
    <div class="gallery" id="photos-gallery"></div>
    <button class="shutter-btn" id="photos-shutter"></button>
  </div>

  <!-- Modal AR (Placement 3D) -->
  <div class="modal-overlay" id="ar-modal" hidden>
    <div class="modal-content">
      <h2>Placer dans votre espace</h2>
      <p>Utilisez la Réalité Augmentée pour ancrer cet objet.</p>
      <model-viewer
        id="ar-model"
        src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
        ios-src="https://modelviewer.dev/shared-assets/models/Astronaut.usdz"
        ar
        ar-modes="webxr scene-viewer quick-look"
        ar-placement="floor"
        camera-controls
        shadow-intensity="1"
        style="width: 100%; height: 300px; border-radius: 16px; background: transparent;">
      </model-viewer>
      <button class="btn-secondary" id="ar-modal-close">Fermer</button>
    </div>
  </div>

  <!-- Modal Spotify -->
  <div class="modal-overlay" id="spotify-modal" hidden>
    <div class="modal-content">
      <h2>🎵 Spotify</h2>
      <p>Entrez votre token d'accès développeur.</p>
      <input type="text" id="spotify-token" placeholder="BQD..." class="text-input">
      <div class="modal-actions">
        <button class="btn-primary" id="spotify-connect">Connecter</button>
        <button class="btn-secondary" id="spotify-cancel">Annuler</button>
      </div>
    </div>
  </div>

  <!-- Barre d'action principale -->
  <div class="bottom-bar">
    <button class="pill-btn" id="camera-button">Activer Caméra</button>
    <button class="pill-btn" id="motion-button" disabled>⌖ Gyro</button>
    <button class="pill-btn" id="scan-button" disabled>◌ Scan</button>
    <button class="pill-btn" id="upload-button" disabled>＋ Vidéo</button>
    <button class="pill-btn accent" id="vr-button" disabled>🥽 VR</button>
    <input id="video-file" type="file" accept="video/*" hidden>
  </div>
</body>
</html>
